services:
  campfire:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - "campfire-storage:/rails/storage"
    environment:
      - SERVICE_URL_CAMPFIRE_80
      - "SECRET_KEY_BASE=${SERVICE_BASE64_64_CAMPFIRE}"
      - "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
      - "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
      - "DISABLE_SSL=${DISABLE_SSL:-true}"
      - "SSL_DOMAIN=${SSL_DOMAIN:-false}"
      - "SKIP_TELEMETRY=${SKIP_TELEMETRY:-true}"
      - "SENTRY_DSN=${SENTRY_DSN}"
      - "CAMPFIRE_JITSI_BASE_URL=${CAMPFIRE_JITSI_BASE_URL:-}"
      - "CAMPFIRE_JITSI_APP_ID=${CAMPFIRE_JITSI_APP_ID:-campfire}"
      - "CAMPFIRE_JITSI_APP_SECRET=${CAMPFIRE_JITSI_APP_SECRET:-}"
      - "CAMPFIRE_JITSI_XMPP_DOMAIN=${CAMPFIRE_JITSI_XMPP_DOMAIN:-meet.jitsi}"
    ports:
      - "8989:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campfire-storage:
